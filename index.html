<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة المشرف - أفكار تطوير المادة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .ideas-list {
            margin-top: 20px;
        }
        .idea-item {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }
        .student-name {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .idea-text {
            color: #34495e;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .timestamp {
            font-size: 12px;
            color: #7f8c8d;
        }
        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            position: absolute;
            top: 15px;
            left: 15px;
        }
        .delete-btn:hover {
            background-color: #c0392b;
        }
        .no-ideas {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 20px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>أفكار الطلاب لتطوير الجانب العملي لمادة الأجهزة</h1>
        <div class="ideas-list" id="ideasList">
            <div class="no-ideas">جاري تحميل الأفكار...</div>
        </div>
        <div class="back-link">
            <a href="index.html">العودة إلى صفحة الإرسال</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCAko7XItvf5nE6kF9AiFTyS9aag5HRzAY",
            authDomain: "data11-11740.firebaseapp.com",
            databaseURL: "https://data11-11740-default-rtdb.firebaseio.com",
            projectId: "data11-11740",
            storageBucket: "data11-11740.firebasestorage.app",
            messagingSenderId: "317387675546",
            appId: "1:317387675546:web:ee41dae1ab9c8fe76dcc23",
            measurementId: "G-NN9QMS0TYG"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Reference to the ideas in the database
        const ideasRef = ref(database, 'ideas');

        // Listen for changes in the ideas data
        onValue(ideasRef, (snapshot) => {
            const ideasList = document.getElementById('ideasList');
            ideasList.innerHTML = '';
            
            const data = snapshot.val();
            
            if (data) {
                // Convert object to array and sort by timestamp (newest first)
                const ideasArray = Object.entries(data).map(([key, value]) => ({
                    id: key,
                    ...value
                })).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                
                // Display each idea
                ideasArray.forEach(idea => {
                    const ideaElement = document.createElement('div');
                    ideaElement.className = 'idea-item';
                    
                    const formattedDate = new Date(idea.timestamp).toLocaleString('ar-SA');
                    
                    ideaElement.innerHTML = `
                        <button class="delete-btn" data-id="${idea.id}">حذف</button>
                        <div class="student-name">${idea.studentName}</div>
                        <div class="idea-text">${idea.idea}</div>
                        <div class="timestamp">${formattedDate}</div>
                    `;
                    
                    ideasList.appendChild(ideaElement);
                });
                
                // Add event listeners to delete buttons
                document.querySelectorAll('.delete-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const ideaId = this.getAttribute('data-id');
                        const ideaRef = ref(database, `ideas/${ideaId}`);
                        
                        if (confirm('هل أنت متأكد من حذف هذه الفكرة؟')) {
                            remove(ideaRef).catch(error => {
                                console.error('Error deleting idea:', error);
                                alert('حدث خطأ أثناء حذف الفكرة');
                            });
                        }
                    });
                });
            } else {
                ideasList.innerHTML = '<div class="no-ideas">لا توجد أفكار مضافة بعد</div>';
            }
        }, (error) => {
            console.error('Error fetching ideas:', error);
            document.getElementById('ideasList').innerHTML = '<div class="no-ideas">حدث خطأ في تحميل الأفكار</div>';
        });
    </script>
</body>
</html>
